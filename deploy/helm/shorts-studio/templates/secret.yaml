{{- if .Values.secretEnv }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "shorts-studio.fullname" . }}
  labels:
    {{- include "shorts-studio.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secretEnv }}
  {{- if eq $key "SHORTS_API_TOKEN" }}
  {{- if not $value }}
  {{- fail "secretEnv.SHORTS_API_TOKEN is required: set it with --set-string secretEnv.SHORTS_API_TOKEN=<token>" }}
  {{- end }}
  {{- end }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
